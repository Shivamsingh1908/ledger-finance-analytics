name: Process recurring transactions

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process due recurring transactions
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "$API_BASE_URL" ]]; then
            echo "::error::Repository secret API_BASE_URL is missing. Set it to the Render API base URL."
            exit 1
          fi
          if [[ -z "$SCHEDULER_SECRET" ]]; then
            echo "::error::Repository secret SCHEDULER_SECRET is missing. Set it to the same value as Render Scheduler__Secret."
            exit 1
          fi
          if [[ ! "$API_BASE_URL" =~ ^https:// ]]; then
            echo "::error::API_BASE_URL must be an HTTPS base URL, without an /api suffix."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --retry 3 --retry-delay 5 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST "${API_BASE_URL%/}/api/jobs/process-recurring" \
            --header "X-Scheduler-Secret: ${SCHEDULER_SECRET}")"

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "::error::Recurring transaction endpoint returned HTTP $status. A 401 means the GitHub SCHEDULER_SECRET does not match Render Scheduler__Secret."
            cat "$response_file"
            exit 1
          fi

          cat "$response_file"